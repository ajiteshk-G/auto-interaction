<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="car-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-grad)" rx="24"/>
  <ellipse cx="400" cy="360" rx="320" ry="30" fill="#000000" opacity="0.4"/>
  <!-- Sleek Car Silhouette -->
  <g transform="translate(100, 110)">
    <!-- Cabin Roofline -->
    <path d="M 120 170 C 180 90, 260 70, 390 70 C 470 70, 500 110, 540 170 Z" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
    <!-- Window Glass -->
    <path d="M 170 160 C 210 105, 270 85, 380 85 C 440 85, 470 115, 500 160 Z" fill="#0F172A" opacity="0.8"/>
    <!-- Center Pillar -->
    <line x1="330" y1="85" x2="330" y2="160" stroke="#334155" stroke-width="6"/>
    <!-- Main Car Body -->
    <path d="M 30 180 C 40 165, 80 160, 140 165 C 190 120, 270 70, 400 70 C 480 70, 510 120, 560 170 L 580 180 C 600 190, 605 210, 590 225 C 570 230, 550 230, 520 230 C 500 190, 440 190, 420 230 L 200 230 C 180 190, 120 190, 100 230 L 40 230 C 20 230, 10 215, 20 195 Z" fill="url(#car-body)"/>
    <!-- Headlight Neon Accent -->
    <path d="M 25 185 L 65 188 L 60 195 Z" fill="#38BDF8"/>
    <!-- Taillight Neon Accent -->
    <path d="M 575 182 L 590 187 L 585 195 Z" fill="#E11D48"/>
    <!-- Wheel Front -->
    <circle cx="150" cy="230" r="42" fill="#090D16" stroke="#475569" stroke-width="8"/>
    <circle cx="150" cy="230" r="22" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
    <!-- Wheel Rear -->
    <circle cx="470" cy="230" r="42" fill="#090D16" stroke="#475569" stroke-width="8"/>
    <circle cx="470" cy="230" r="22" fill="#1E293B" stroke="#94A3B8" stroke-width="4"/>
  </g>
  <!-- Cyber line under car -->
  <line x1="160" y1="365" x2="640" y2="365" stroke="url(#neon-glow)" stroke-width="3" stroke-linecap="round"/>
  <text x="400" y="415" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#94A3B8" text-anchor="middle">AUTOMOTIVE SHOWROOM SPECIFICATION</text>
</svg>
